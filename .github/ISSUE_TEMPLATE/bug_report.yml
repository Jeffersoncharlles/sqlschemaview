name: Bug report
description: Report incorrect extraction, rendering, or CLI behavior.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the problem and expected behavior.
    validations:
      required: true
  - type: textarea
    id: sql
    attributes:
      label: Minimal SQL input
      render: sql
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SQL Schema View version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
    validations:
      required: true
