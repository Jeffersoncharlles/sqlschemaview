version: 2

project_name: sqlschemaview

builds:
  - id: sqlschemaview
    main: ./cmd/sqlschemaview
    binary: sqlschemaview
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
